  <section class="hero-section">

        </div>
      </div>
      <div class="hero-media reveal">
        <picture>
          <source srcset="img/hero-interior-1600.webp 1600w, img/hero-interior-960.webp 960w, img/hero-interior-480.webp 480w" sizes="(max-width:860px) 100vw, 50vw">

        <div class="hero-media-badge">

            <img src="img/hero-portrait-960.webp" alt="Matcha berry at SAVVA" loading="lazy">
          </picture>
        </div>
      </div>
    </div>
  </section>

  <section class="proof-strip">
    <div class="container proof-grid">
      <div class="proof-item" data-proof-rating></div>

  <section id="bestsellers">

        <h2 data-best-title></h2>
      </div>
      <div class="bento-grid reveal" data-best-grid></div>

  <section id="menu-teaser">
